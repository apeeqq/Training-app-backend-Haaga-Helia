<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Program</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
    <h1>Edit Program</h1>
    <div>
    <form class="row" th:object="${program}" th:action="@{../save}" action="#" method="post">
        <label for="programId"></label>
        <input type="hidden" th:field="*{programId}" class="form-control"/>
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" />
        <label for="info">Info</label>
        <textarea rows="10" id="info" th:field="*{info}" />
        <select id="categorylist" th:field="*{category}" class="form-control">
            <option th:each="category: ${categories}" th:value="${category.categoryId}" th:text="${category.category}"></option>
        </select>
        <input class="btn btn-success" type="submit" value="Save"></input>
    </form>
    </div>
</body>
</html>
