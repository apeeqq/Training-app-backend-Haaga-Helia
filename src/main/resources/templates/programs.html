<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trapp</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
	<h1>Programs</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Info</th>
            </tr>
        </thead>
        <tbody>
            <tr th:object="${program}" th:each = "program : ${programs}">
                <td th:text="*{name}"></td>
                <td th:text="*{info}"></td>
                <td th:text="*{category.category}"></td>
            </tr>
        </tbody>
    </table>
    <a class="btn btn-success" href="/add">Add Training Program</a>
</body>
</html>
