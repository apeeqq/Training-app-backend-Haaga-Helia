<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Trapp</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
    <a th:if="${#authorization.expression('!isAuthenticated()')}" class="btn btn-primary" href="/login">Sign In</a>
    <form th:if="${#authorization.expression('isAuthenticated()')}" th:action="@{/logout}" method="post">
	    <input class="btn btn-secondary" type="submit" value="Sign Out"/>
    </form>
        <h1 th:if="${#authorization.expression('isAuthenticated()')}"
        th:text="'Logged in as ' + ${#authentication.name}"></h1>
	<h1>Programs</h1>
    <p>Programs are also available at REST API endpoint: /rest/programs</p>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Info</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody>
            <tr th:object="${program}" th:each = "program : ${programs}">
                <td th:text="*{name}"></td>
                <td th:text="*{info}"></td>
                <td th:text="*{category.category}"></td>
                <td sec:authorize="hasAuthority('ADMIN')"><a class="btn btn-danger" th:href="@{/delete/{programId}(programId=*{programId})}">Delete</a></td>
                <td sec:authorize="hasAuthority('ADMIN')"><a class="btn btn-secondary" th:href="@{/edit/{programId}(programId=*{programId})}">Edit</a></td>
            </tr>
        </tbody>
    </table>
    <a sec:authorize="hasAuthority('ADMIN')" class="btn btn-success" href="/add">Add Training Program</a>
</body>
</html>
