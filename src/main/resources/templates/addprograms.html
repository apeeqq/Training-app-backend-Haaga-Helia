<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Program</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
    <h1>Add New Training Program</h1>
    <div>
    <form class="row" th:object="${program}" th:action="@{../add/post}" action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" />
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        <label for="info">Info</label>
        <input type="text" id="info" th:field="*{info}"/>
        <span class="error" th:if="${#fields.hasErrors('info')}" th:errors="*{info}"></span>
        <select id="categorylist" th:field="*{category}" class="form-control">
            <option th:each="category: ${categories}" th:value="${category.categoryId}" th:text="${category.category}"></option>
        </select>
        <input class="btn btn-success" type="submit" value="Save"></input>
    </form>
    </div>
</body>
</html>
